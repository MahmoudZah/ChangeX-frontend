<aside
  class="sticky top-0 hidden h-screen w-[260px] shrink-0 flex-col gap-10 p-6 text-sidebar-foreground lg:flex"
  [class.bg-sidebar-admin]="auth.isAdmin()"
  [class.bg-sidebar]="!auth.isAdmin()"
>
  <div class="flex h-9 items-center gap-3">
    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-[18px] font-bold text-primary">CX</div>
    <div>
      <span class="text-lg font-bold tracking-tight">ChangeX</span>
      @if (auth.isAdmin()) {
        <p class="text-[10px] font-semibold uppercase tracking-wide text-approve">Vendor Admin</p>
      }
    </div>
  </div>

  <nav class="flex flex-1 flex-col gap-2">
    @for (link of links(); track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="bg-sidebar-active text-white"
        [routerLinkActiveOptions]="{ exact: link.path === '/dashboard' }"
        class="flex h-11 items-center gap-3 rounded-lg px-4 text-[15px] font-medium text-white transition hover:bg-sidebar-active"
      >
        <span class="inline-flex h-5 w-5 shrink-0 items-center justify-center overflow-hidden">
          <img [src]="iconPath(link.icon)" alt="" class="h-5 w-5" />
        </span>
        {{ link.label }}
      </a>
    }
  </nav>

  <div>
    <div class="mx-1 mb-9 flex h-9 items-center rounded-full bg-[#452173] p-[3px] text-xs">
      <button
        type="button"
        class="flex h-[30px] flex-1 items-center justify-center gap-1.5 rounded-full px-3"
        [class.bg-sidebar-active]="theme.mode() === 'light'"
        [class.text-white]="theme.mode() === 'light'"
        [class.text-sidebar-muted]="theme.mode() === 'dark'"
        (click)="theme.toggle('light')"
      >
        <img src="/assets/icons/sun.svg" alt="" class="h-3.5 w-3.5" /> Light
      </button>
      <button
        type="button"
        class="flex h-[30px] flex-1 items-center justify-center gap-1.5 rounded-full px-3"
        [class.bg-sidebar-active]="theme.mode() === 'dark'"
        [class.text-white]="theme.mode() === 'dark'"
        [class.text-sidebar-muted]="theme.mode() === 'light'"
        (click)="theme.toggle('dark')"
      >
        <img src="/assets/icons/moon.svg" alt="" class="h-3.5 w-3.5" /> Dark
      </button>
    </div>

    <div class="flex items-center gap-3 border-t border-white/10 pt-4">
      <img [src]="avatarPath()" alt="" class="h-9 w-9 shrink-0 rounded-full object-cover" />
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold">{{ auth.user()?.name }}</p>
        <p class="truncate text-xs text-[#8bbfb8]">{{ auth.user()?.company }}</p>
      </div>
      <button type="button" class="text-xs text-sidebar-muted hover:text-white" (click)="logout()" aria-label="Sign out">Out</button>
    </div>
  </div>
</aside>
