<div class="flex min-h-screen items-center justify-center bg-[#f1f3f4] px-4 py-10">
  <div class="w-full max-w-[420px] rounded-xl bg-white p-10 shadow-[0_10px_15px_rgba(0,0,0,0.05)]">
    <div class="mb-8 flex flex-col items-center text-center">
      <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-primary text-[28px] font-bold text-white">
        CX
      </div>
      <h1 class="text-2xl font-bold text-[#1e293b]">ChangeX</h1>
      <p class="mt-1.5 text-sm text-[#64748b]">Enter credentials to access your workspace</p>
    </div>

    <form class="space-y-5" (ngSubmit)="submit()">
      <app-form-field label="Business Email">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          class="h-[43px] w-full rounded-lg border border-[#e2e8f0] bg-white px-3 text-[15px] text-[#1e293b] outline-none ring-primary transition focus:ring-2"
          placeholder="you@company.com"
        />
      </app-form-field>

      <app-form-field label="Password">
        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
            class="h-[43px] w-full rounded-lg border border-[#e2e8f0] bg-white px-3 pr-11 text-[15px] text-[#1e293b] outline-none ring-primary transition focus:ring-2"
            placeholder="••••••••••••"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 flex h-[18px] w-[18px] -translate-y-1/2 items-center justify-center"
            (click)="togglePassword()"
            aria-label="Toggle password visibility"
          >
            <img src="/assets/icons/eye-closed.svg" alt="" class="h-[18px] w-[18px]" />
          </button>
        </div>
      </app-form-field>

      @if (error()) {
        <p class="text-sm text-destructive">{{ error() }}</p>
      }

      <button
        type="submit"
        class="mt-3 flex h-12 w-full items-center justify-center rounded-lg bg-primary text-base font-semibold text-white transition hover:opacity-95 disabled:opacity-60"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Signing In…' : 'Sign In' }}
      </button>
    </form>

    <p class="mt-5 text-center text-xs leading-5 text-muted-foreground">Password recovery is not exposed by the current ChangeX API. Contact your workspace administrator if you cannot sign in.</p>
  </div>
</div>
