<div class="flex min-h-screen items-center justify-center bg-background px-4">
  <div class="w-full max-w-md rounded-2xl border border-border bg-card p-10 shadow-lg">
    <div class="mb-8 flex flex-col items-center text-center">
      <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-primary text-lg font-bold text-primary-foreground">
        CX
      </div>
      <h1 class="text-2xl font-bold text-primary">ChangeX</h1>
      <p class="mt-2 text-sm text-muted-foreground">Enter credentials to access your workspace</p>
    </div>

    <form class="space-y-5" (ngSubmit)="submit()">
      <app-form-field label="Business Email">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="w-full rounded-xl border border-input bg-background px-4 py-3 text-sm outline-none ring-primary focus:ring-2"
          placeholder="you@company.com"
        />
      </app-form-field>

      <app-form-field label="Password">
        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            class="w-full rounded-xl border border-input bg-background px-4 py-3 pr-11 text-sm outline-none ring-primary focus:ring-2"
            placeholder="••••••••"
          />
          <button
            type="button"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground"
            (click)="togglePassword()"
            aria-label="Toggle password visibility"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.8 21.8 0 0 1 5.06-6.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.49"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"/></svg>
            }
          </button>
        </div>
      </app-form-field>

      @if (error()) {
        <p class="text-sm text-destructive">{{ error() }}</p>
      }

      <button
        type="submit"
        class="w-full rounded-xl bg-primary px-4 py-3 text-sm font-semibold text-primary-foreground transition hover:opacity-90"
      >
        Sign In
      </button>
    </form>

    <p class="mt-6 text-center text-sm">
      <a href="#" class="font-medium text-primary underline-offset-2 hover:underline">Forgot password?</a>
    </p>
  </div>
</div>
