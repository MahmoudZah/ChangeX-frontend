<div class="mb-8">
  <h1 class="text-3xl font-bold tracking-tight">New Change Request</h1>
  <p class="mt-1 text-muted-foreground">Propose adjustments, updates, or feature additions to your active project codebases</p>
</div>

<form class="rounded-2xl border border-border bg-card p-8 shadow-sm" (ngSubmit)="submit()">
  <div class="mb-6 grid gap-5 lg:grid-cols-[2fr_1fr]">
    <app-form-field label="Change Request Title">
      <input
        [(ngModel)]="title"
        name="title"
        required
        placeholder="e.g., Apple Pay integrations inside Checkout"
        class="w-full rounded-xl border border-input bg-background px-4 py-3 text-sm outline-none ring-primary focus:ring-2"
      />
    </app-form-field>

    <app-form-field label="Select Project">
      <select [(ngModel)]="projectId" name="projectId" class="w-full rounded-xl border border-input bg-background px-4 py-3 text-sm">
        @for (p of projectList(); track p.id) {
          <option [value]="p.id">{{ p.name }}</option>
        }
      </select>
    </app-form-field>
  </div>

  <div class="mb-6">
    <p class="mb-2 text-sm font-semibold">Requested Priority</p>
    <div class="flex flex-wrap gap-2">
      @for (p of priorities; track p) {
        <button
          type="button"
          class="rounded-xl border px-4 py-2 text-sm font-medium transition"
          [class.border-primary]="priority === p"
          [class.bg-accent]="priority === p"
          [class.border-input]="priority !== p"
          (click)="priority = p"
        >
          {{ p }}
        </button>
      }
    </div>
  </div>

  <div class="mb-6">
    <app-form-field label="Description & Business Rationale">
      <textarea
        [(ngModel)]="description"
        name="description"
        rows="5"
        class="w-full rounded-xl border border-input bg-background px-4 py-3 text-sm outline-none ring-primary focus:ring-2"
        placeholder="Describe the business need and expected outcome..."
      ></textarea>
    </app-form-field>
  </div>

  <div class="mb-6">
    <app-form-field label="Scope & Functional Requirements (Optional)">
      <textarea
        [(ngModel)]="scope"
        name="scope"
        rows="4"
        class="w-full rounded-xl border border-input bg-background px-4 py-3 text-sm outline-none ring-primary focus:ring-2"
        placeholder="One requirement per line..."
      ></textarea>
    </app-form-field>
  </div>

  <div class="mb-6">
    <p class="mb-2 text-sm font-semibold">Attachments & Screenshots</p>
    <div class="rounded-xl border-2 border-dashed border-border bg-muted/30 px-6 py-10 text-center">
      <div class="mx-auto mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-accent text-primary">↑</div>
      <p class="text-sm text-muted-foreground">Drag files here or click to upload</p>
      @if (attachmentName()) {
        <p class="mt-3 inline-flex items-center gap-2 rounded-lg bg-card px-3 py-1.5 text-sm shadow-sm">
          <span class="text-destructive">PDF</span> {{ attachmentName() }}
        </p>
      }
    </div>
  </div>

  <div class="mb-8">
    <app-form-field label="Initial Support Ticket Comment (Optional)">
      <textarea
        [(ngModel)]="ticketComment"
        name="ticketComment"
        rows="3"
        class="w-full rounded-xl border border-input bg-background px-4 py-3 text-sm outline-none ring-primary focus:ring-2"
      ></textarea>
    </app-form-field>
  </div>

  <div class="flex justify-end gap-3">
    <button type="button" class="rounded-xl bg-muted px-5 py-2.5 text-sm font-semibold" (click)="cancel()">Cancel</button>
    <button type="submit" class="rounded-xl bg-primary px-5 py-2.5 text-sm font-semibold text-primary-foreground">Submit Change Request</button>
  </div>
</form>
