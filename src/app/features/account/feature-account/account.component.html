<div class="mb-8">
  <h1 class="text-3xl font-bold tracking-tight">Account / Profile</h1>
  <p class="mt-1 text-muted-foreground">Your workspace identity and organization details</p>
</div>

<section class="max-w-xl rounded-2xl border border-border bg-card p-8 shadow-sm">
  <div class="mb-6 flex items-center gap-4">
    <div class="flex h-16 w-16 items-center justify-center rounded-full bg-primary text-xl font-bold text-primary-foreground">
      {{ auth.user()?.name?.charAt(0) }}
    </div>
    <div>
      <h2 class="text-xl font-bold">{{ auth.user()?.name }}</h2>
      <p class="text-sm text-muted-foreground">{{ auth.user()?.company }}</p>
    </div>
  </div>
  <dl class="space-y-4 text-sm">
    <div><dt class="text-muted-foreground">Email</dt><dd class="font-medium">{{ auth.user()?.email }}</dd></div>
    <div><dt class="text-muted-foreground">Role</dt><dd class="font-medium">{{ auth.user()?.role }}</dd></div>
  </dl>
</section>
