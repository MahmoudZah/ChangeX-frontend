<div class="mb-8 flex flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="text-3xl font-bold tracking-tight">Clients</h1>
    <p class="mt-1 text-muted-foreground">Manage client organizations and contacts</p>
  </div>
</div>

<app-data-table [total]="clients().length" [from]="1" [to]="clients().length">
  <tr header>
    <th class="px-4 py-3">Client</th>
    <th class="px-4 py-3">Email</th>
    <th class="px-4 py-3">Primary Contact</th>
    <th class="px-4 py-3">Projects</th>
  </tr>
  @for (client of clients(); track client.id) {
    <tr body class="border-t border-border hover:bg-muted/30">
      <td class="px-4 py-3 font-semibold">{{ client.name }}</td>
      <td class="px-4 py-3 text-muted-foreground">{{ client.email }}</td>
      <td class="px-4 py-3 text-muted-foreground">{{ client.contactInfo }}</td>
      <td class="px-4 py-3">{{ client.projectCount }}</td>
    </tr>
  }
</app-data-table>
