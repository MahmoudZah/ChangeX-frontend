<header class="mb-8">
  <h1 class="text-[28px] font-bold">{{ isAdmin() ? 'Invoice Management' : 'Invoices' }}</h1>
  <p class="mt-1 text-sm text-muted-foreground">Billing information for ChangeX workspaces</p>
</header>

<section class="mx-auto max-w-2xl rounded-[10px] border border-border bg-card px-6 py-12 text-center md:px-10">
  <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-muted">
    <img src="/assets/icons/file.svg" alt="" class="h-6 w-6" />
  </div>
  <h2 class="mt-5 text-lg font-bold">Invoice data is unavailable</h2>
  <p class="mx-auto mt-2 max-w-lg text-sm leading-6 text-muted-foreground">
    {{ unavailableMessage }} No totals, payment states, or invoice actions can be shown reliably.
  </p>
</section>
